apiVersion: apps/v1
kind: Deployment
metadata: {name: inference-onnx}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: inference-onnx}}
  template:
    metadata: {labels: {app: inference-onnx}}
    spec:
      containers:
        - name: inference-onnx
          image: inference-onnx
          env:
            - {name: SHM_FRAME_NAME, value: camera_frame}
            - {name: EXECUTION_PROVIDER, value: auto}
          resources:
            limits: {nvidia.com/gpu: 1}   # remove if CPU-only
          ports: [{containerPort: 5555}]
          volumeMounts:
            - {name: shm, mountPath: /dev/shm}
            - {name: models, mountPath: /opt/models}
      volumes:
        # hostPath, not emptyDir: this must be the SAME /dev/shm the other
        # pods use, and emptyDir would give each pod its own private tmpfs.
        # Only safe because this is a single-node edge device.
        - name: shm
          hostPath: {path: /dev/shm, type: Directory}
        - name: models
          persistentVolumeClaim: {claimName: models}
---
apiVersion: v1
kind: Service
metadata: {name: inference-onnx}
spec: {selector: {app: inference-onnx}, ports: [{port: 5555, targetPort: 5555}]}
