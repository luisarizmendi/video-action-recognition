apiVersion: apps/v1
kind: Deployment
metadata: {name: ops-dashboard}
spec:
  replicas: 1
  selector: {matchLabels: {app: ops-dashboard}}
  template:
    metadata: {labels: {app: ops-dashboard}}
    spec:
      containers:
        - name: ops-dashboard
          image: ops-dashboard
          ports: [{containerPort: 8080}]
          env:
            - {name: KAFKA_BOOTSTRAP, value: "bus-kafka-kafka-bootstrap.bus-streams.svc:9093"}
            - {name: KAFKA_USERNAME, value: dc-consumers}
            - name: KAFKA_PASSWORD
              valueFrom: {secretKeyRef: {name: dc-consumers, key: password}}
            - {name: KAFKA_CA_PATH, value: /certs/ca.crt}
            - {name: S3_ENDPOINT, value: "http://s4.bus-s4.svc:7480"}
            - {name: S3_PUBLIC_ENDPOINT, value: "https://s4-s3-bus-s4.apps.CHANGEME.example.com"}
            - {name: S3_ACCESS_KEY, value: CHANGEME}
            - {name: S3_SECRET_KEY, value: CHANGEME}
          readinessProbe: {httpGet: {path: /healthz, port: 8080}}
          volumeMounts: [{name: ca, mountPath: /certs}]
      volumes:
        - name: ca
          secret: {secretName: bus-kafka-cluster-ca-cert}
---
apiVersion: v1
kind: Service
metadata: {name: ops-dashboard}
spec:
  selector: {app: ops-dashboard}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: route.openshift.io/v1
kind: Route
metadata: {name: ops-dashboard}
spec:
  to: {kind: Service, name: ops-dashboard}
  port: {targetPort: 8080}
  tls: {termination: edge}
